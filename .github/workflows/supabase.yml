# Deploys the server side (Supabase Edge Functions and settings) when it changes.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  PROJECT_REF: xvqamjaxutxfyzkbtigr
  SITE_URL: https://dizzydwarf0013.github.io/pff-coach/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the page-reading function
        run: node --experimental-strip-types --no-warnings supabase/functions/extract/handler.test.ts

      - name: Check secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          ok=true
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::warning::SUPABASE_ACCESS_TOKEN secret is missing, so nothing was deployed."; ok=false; }
          tok=$(printf %s "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          if [ -n "$tok" ] && [[ "$tok" != sbp_* ]]; then
            case "$tok" in
              sb_secret_*) kind="a project secret key (sb_secret_…)";;
              sb_publishable_*) kind="the publishable key (sb_publishable_…)";;
              eyJ*) kind="a project API key (eyJ…)";;
              *) kind="something that isn't a Supabase access token";;
            esac
            echo "::error::SUPABASE_ACCESS_TOKEN looks like $kind. It needs a personal access token starting with sbp_, created at supabase.com/dashboard/account/tokens."
            exit 1
          fi
          echo "::add-mask::$tok"
          echo "SUPABASE_ACCESS_TOKEN=$tok" >> "$GITHUB_ENV"
          [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY secret is missing. Pages can't be read until it's added."
          [ -n "$ALLOWED_EMAILS" ] || echo "::warning::ALLOWED_EMAILS secret is missing. Nobody can read pages until it lists her email."
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Deploy the extract function
        if: steps.secrets.outputs.ok == 'true'
        run: |
          # Server-side bundling first; fall back to bundling with Docker on the runner.
          if out=$(supabase functions deploy extract --project-ref "$PROJECT_REF" --no-verify-jwt --use-api 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          echo "::warning::Server-side bundling failed: $(echo "$out" | grep -v '^$' | tail -4 | tr '\n' ' ')"
          if out=$(supabase functions deploy extract --project-ref "$PROJECT_REF" --no-verify-jwt 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          echo "::error::Deploy failed: $(echo "$out" | grep -v '^$' | tail -6 | tr '\n' ' ')"
          exit 1

      - name: Set function secrets
        if: steps.secrets.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          args=()
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$ALLOWED_EMAILS" ] && args+=("ALLOWED_EMAILS=$ALLOWED_EMAILS")
          if [ ${#args[@]} -gt 0 ]; then
            out=$(supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" 2>&1) || { echo "::error::Setting secrets failed: $(echo "$out" | tail -3 | tr '\n' ' ')"; exit 1; }
            echo "Secrets set"
          fi

      - name: Point sign-in emails at the app
        if: steps.secrets.outputs.ok == 'true'
        run: |
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\": \"$SITE_URL\", \"uri_allow_list\": \"$SITE_URL**\"}")
          [ "$code" -lt 300 ] || { echo "::error::Updating the auth site URL failed ($code): $(head -c 300 /tmp/auth.json)"; exit 1; }
          echo "Auth site URL set to $SITE_URL"

      - name: Smoke test
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url="https://$PROJECT_REF.supabase.co/functions/v1/extract"
          sleep 5
          pre=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$url")
          unauth=$(curl -s -o /tmp/body -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' -d '{}')
          echo "preflight=$pre unauthenticated=$unauth body=$(cat /tmp/body)"
          [ "$pre" = "204" ] && [ "$unauth" = "401" ] || { echo "::error::The function didn't respond as expected."; exit 1; }
          echo "::notice::Page reader is live and rejects requests without sign-in."
